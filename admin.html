<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel</title>

<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;padding:20px}
input,select,textarea,button{
 width:100%;padding:14px;font-size:16px;
 margin-top:12px;border:none;border-radius:12px
}
button{background:#00c853;color:#000;font-weight:bold}
canvas{
 background:#111;border-radius:12px;margin-top:20px
}
</style>
</head>
<body>

<h3>Admin Login</h3>
<input id="au" placeholder="Admin Username">
<input id="ap" type="password" placeholder="Password">
<button onclick="adminLogin()">Login</button>

<div id="panel" style="display:none">

<h3>System</h3>
<input id="key" placeholder="DeepSeek API Key">
<textarea id="prompt" placeholder="System Prompt"></textarea>
<button onclick="saveSystem()">Simpan System</button>

<h3>Buat Akun</h3>
<input id="u" placeholder="Username">
<input id="p" placeholder="Password">
<select id="type">
 <option value="free">FREE (15K / hari)</option>
 <option value="premium">PREMIUM (Unlimited)</option>
</select>
<input id="dur" placeholder="Durasi: 1d / 12h / 30m / 1mo">
<button onclick="addUser()">Buat Akun</button>

<h3>📊 Grafik Pemakaian Token</h3>
<canvas id="chart" width="350" height="200"></canvas>
<button onclick="drawChart()">Refresh Grafik</button>

</div>

<script>
const ADMIN={user:"teleport",pass:"teleport123"};

function adminLogin(){
 if(au.value!=ADMIN.user||ap.value!=ADMIN.pass)
  return alert("Admin salah");
 panel.style.display="block";
 drawChart();
}

key.value=localStorage.getItem("deepseek_key")||"";
prompt.value=localStorage.getItem("system_prompt")||"";

function saveSystem(){
 localStorage.setItem("deepseek_key",key.value);
 localStorage.setItem("system_prompt",prompt.value);
 alert("System disimpan");
}

function parseDur(s){
 let ms=0;
 if(s.includes("mo"))ms=+s.replace("mo","")*2592000000;
 else if(s.includes("d"))ms=+s.replace("d","")*86400000;
 else if(s.includes("h"))ms=+s.replace("h","")*3600000;
 else if(s.includes("m"))ms=+s.replace("m","")*60000;
 return Date.now()+ms;
}

function addUser(){
 const users=JSON.parse(localStorage.getItem("users")||"{}");
 users[u.value]={
  pass:p.value,
  type:type.value,
  used:0,
  lastReset:Date.now(),
  exp:parseDur(dur.value)
 };
 localStorage.setItem("users",JSON.stringify(users));
 alert("Akun dibuat");
 drawChart();
}

/* GRAFIK */
function drawChart(){
 const c=chart.getContext("2d");
 c.clearRect(0,0,chart.width,chart.height);

 const users=JSON.parse(localStorage.getItem("users")||"{}");
 const names=Object.keys(users);
 if(!names.length)return;

 const max=Math.max(...names.map(n=>users[n].used||0),15000);
 let x=20;

 names.forEach(n=>{
  const u=users[n];
  const h=(u.used||0)/max*150;
  c.fillStyle=u.type=="premium"?"#03a9f4":"#00c853";
  c.fillRect(x,180-h,20,h);
  c.fillStyle="#fff";
  c.fillText(n.slice(0,5),x-2,195);
  x+=30;
 });
}
</script>

</body>
</html>
